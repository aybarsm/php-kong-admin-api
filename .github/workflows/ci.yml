name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer validate --strict
      - uses: ramsey/composer-install@v4
      - run: composer audit
      - run: composer cs
      - run: composer analyse

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        deps: [lowest, highest]
        # The lowest psr/http-factory (1.0.1, shipped by WHMCS 9.0.8 on PHP 8.3) declares implicitly nullable
        # parameters, which PHP 8.4+ deprecates and failOnDeprecation turns into a failure. Lower bounds are
        # tested on 8.3; 8.4+ runs the highest versions.
        exclude:
          - php: "8.4"
            deps: lowest
          - php: "8.5"
            deps: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.deps }}
      - run: composer analyse
      - run: vendor/bin/pest --coverage --min=90
